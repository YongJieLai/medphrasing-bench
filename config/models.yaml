# 模型与端点配置。api key 通过环境变量注入（见 .env.example）
# 用户预算有限，先统一用最便宜的 qwen-flash，跑通后按需升级。
providers:
  qwen:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: QWEN_API_KEY
  deepseek:
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY

roles:
  patient:      # 患者模拟器
    provider: qwen
    model: qwen-flash
  doctor:       # 医生 agent
    provider: qwen
    model: qwen-flash
  extractor:    # 信息提取器（AIU 抽取）
    provider: qwen
    model: qwen-flash
  builder:      # 数据构建（AIU 转换 / 措辞生成）
    provider: qwen
    model: qwen-flash
  annotator:    # 主标注（量大，用便宜模型）
    provider: qwen
    model: qwen-flash
  reviewer:     # 核对/金标准（强一档，交叉验证）
    provider: qwen
    model: qwen-plus
